services:
  mysql:
    image: mysql:8.4
    container_name: ai-task-extractor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ai_task_extractor}
      MYSQL_USER: ${DB_USER:-ai_task_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-me}
      TZ: UTC
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change-root-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
