spring:
  application:
    name: ai-task-extractor
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_task_extractor}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER:ai_task_user}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

app:
  ai:
    time-zone: ${APP_TIME_ZONE:Asia/Tashkent}

server:
  error:
    include-message: never
    include-stacktrace: never
